<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Creador de Planteles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d16;--panel:#16162a;--panel2:#1e1e38;--fg:#f4f4e8;--mute:#9a9ab8;--acc:#ffd23f;--line:#34345a;--good:#3ddc84;--bad:#ff4d4d}
:root[data-theme="light"]{--bg:#e9e9f2;--panel:#ffffff;--panel2:#f0f0f7;--fg:#1a1a2a;--mute:#5a5a78;--line:#c8c8dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px}
body{display:grid;grid-template-rows:auto 1fr;grid-template-columns:200px 1fr 250px;grid-template-areas:"top top top" "tools main props";height:100vh;overflow:hidden}
header{grid-area:top;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-family:'Press Start 2P',monospace;font-size:12px;margin:0 12px 0 0;color:var(--acc)}
button,select,input{font:inherit;color:var(--fg);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.on{background:var(--acc);color:#111;border-color:var(--acc)}
button.go{background:var(--good);color:#06240f;border-color:var(--good);font-weight:600}
#tools{grid-area:tools;background:var(--panel);border-right:1px solid var(--line);padding:10px;overflow:auto;display:flex;flex-direction:column;gap:5px}
#tools .grp{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 2px}
#tools button{text-align:left;display:flex;justify-content:space-between;gap:6px}
#tools kbd{font-size:11px;color:var(--mute)}
main{grid-area:main;position:relative;overflow:hidden;background:#2f6b2a}
#cv{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
#hint{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(10,10,20,.82);color:#f4f4e8;padding:7px 10px;border-radius:6px;font-size:13px;pointer-events:none}
#coords{position:absolute;right:10px;top:10px;background:rgba(10,10,20,.75);color:#f4f4e8;padding:4px 8px;border-radius:6px;font-size:12px;pointer-events:none}
#props{grid-area:props;background:var(--panel);border-left:1px solid var(--line);padding:12px;overflow:auto}
#props h2{font-size:13px;margin:0 0 8px;color:var(--acc)}
#props label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:6px 0;font-size:13px}
#props input[type=number]{width:80px}#props input[type=text]{width:120px}
#props .note{font-size:12px;color:var(--mute);line-height:1.45;margin-top:10px}
#props .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media (max-width:900px){body{grid-template-columns:1fr;grid-template-rows:auto auto 1fr auto;grid-template-areas:"top" "tools" "main" "props"}
  #tools{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);max-height:120px}#tools .grp{display:none}#props{border-left:0;border-top:1px solid var(--line);max-height:30vh}}
</style>
</head>
<body>
<header>
  <h1>CREADOR DE PLANTELES</h1>
  <button id="bNew">Nuevo</button>
  <button id="bOpen">Abrir archivo</button>
  <button id="bSave">Guardar archivo</button>
  <button id="bUndo" title="Ctrl+Z">Deshacer</button>
  <button id="bCheck">Revisar</button>
  <button id="bBg">Fondo: imagen…</button>
  <button id="bSat">Fondo: satélite Ciudad Vial</button>
  <button id="bCal">Calibrar fondo</button>
  <label style="display:flex;gap:4px;align-items:center;font-size:13px"><input type="checkbox" id="showExam" checked> Pasos del examen</label>
  <button id="bAddExam">+ Paso del examen</button>
  <button id="bHelp">? Ayuda</button>
  <button id="bPlay" class="go">▶ Probar en el juego</button>
  <a href="index.html" style="color:var(--mute);margin-left:auto">Volver al juego</a>
  <input type="file" id="fOpen" accept=".json,application/json" hidden>
  <input type="file" id="fBg" accept="image/*" hidden>
</header>
<aside id="tools">
  <div class="grp">Editar</div>
  <button data-tool="sel">Seleccionar / mover <kbd>V</kbd></button>
  <button data-tool="del">Borrar <kbd>X</kbd></button>
  <button data-tool="pan">Mover vista <kbd>M</kbd></button>
  <div class="grp">Calles</div>
  <button data-tool="road" data-lanes="2">Calle 2 carriles <kbd>C</kbd></button>
  <button data-tool="road" data-lanes="1">Calle 1 carril <kbd>1</kbd></button>
  <button data-tool="road" data-lanes="1w">1 carril ancho <kbd>W</kbd></button>
  <button data-tool="ring" data-lanes="1">Rotonda 1 carril <kbd>R</kbd></button>
  <button data-tool="ring" data-lanes="2">Rotonda 2 carriles <kbd>2</kbd></button>
  <button data-tool="area" data-kind="asfalto">Asfalto / intersección <kbd>A</kbd></button>
  <div class="grp">Señales y conos</div>
  <button data-tool="cone" data-col="n">Cono naranja <kbd>K</kbd></button>
  <button data-tool="cone" data-col="v">Cono verde <kbd>G</kbd></button>
  <button data-tool="sign" data-kind="alto">ALTO <kbd>S</kbd></button>
  <button data-tool="sign" data-kind="ceda">CEDA <kbd>Y</kbd></button>
  <button data-tool="text">Texto en el piso <kbd>T</kbd></button>
  <button data-tool="slot">Espacio de parqueo <kbd>P</kbd></button>
  <div class="grp">Entorno</div>
  <button data-tool="bldg">Edificio <kbd>B</kbd></button>
  <button data-tool="area" data-kind="zacate">Zacate / isla <kbd>Z</kbd></button>
  <button data-tool="area" data-kind="acera">Acera <kbd>D</kbd></button>
  <button data-tool="area" data-kind="techo">Techo / toldo solar <kbd>U</kbd></button>
  <button data-tool="area" data-kind="limite">Límite del plantel <kbd>5</kbd></button>
  <button data-tool="fence" data-kind="malla">Valla de malla <kbd>F</kbd></button>
  <button data-tool="fence" data-kind="verja">Verja de hierro <kbd>J</kbd></button>
  <button data-tool="fence" data-kind="muro">Muro / tapia <kbd>H</kbd></button>
  <button data-tool="fence" data-kind="barrera">Barrera naranja <kbd>N</kbd></button>
  <button data-tool="pole" data-kind="luz">Poste de luz <kbd>L</kbd></button>
  <button data-tool="pole" data-kind="poste">Poste / columna <kbd>Q</kbd></button>
  <button data-tool="tree">Árbol <kbd>3</kbd></button>
  <button data-tool="slope">Subida / pendiente <kbd>4</kbd></button>
  <button data-tool="person" data-kind="evaluador">Evaluador <kbd>E</kbd></button>
  <button data-tool="person" data-kind="persona">Persona <kbd>O</kbd></button>
  <button data-tool="start">Inicio del carro <kbd>I</kbd></button>
</aside>
<main>
  <canvas id="cv"></canvas>
  <div id="coords"></div>
  <div id="hint"></div>
</main>
<aside id="props"></aside>
<script>
// ======================= CREADOR DE PLANTELES =======================
// Todo se guarda en METROS (x hacia la derecha, y hacia abajo). El juego lo convierte con 4 unidades por metro.
// Medidas de referencia (MOPT / promedios):
const REF={laneW:3.5,laneUrb:3.3,wideW:5.0,ringLaneW:4.5,car:{L:4.5,W:1.8},slot:{w:2.5,l:5.0},cone:.35,stopW:.4};
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let M=blank(),tool='sel',opt={lanes:'2',kind:'',col:'n'},draft=null,sel=null,drag=null,hover=null,cal=null;
let view={x:-5,y:-5,z:8};// z = píxeles por metro
let BG={img:null};const HIST=[];
function blank(){return{v:1,name:'Mi plantel',w:120,h:100,limit:20,roads:[],rings:[],areas:[],bldgs:[],cones:[],signs:[],texts:[],slots:[],people:[],fences:[],poles:[],trees:[],slopes:[],start:{x:20,y:20,ang:0},bg:null}}
// ---------- guardar / historial ----------
function save(push=true){if(push){HIST.push(JSON.stringify(M));if(HIST.length>80)HIST.shift()}try{localStorage.setItem('pp_custom',JSON.stringify(M))}catch(e){}draw();props()}
function snapshot(){HIST.push(JSON.stringify(M));if(HIST.length>80)HIST.shift()}
function undo(){if(HIST.length<2)return;HIST.pop();M=JSON.parse(HIST[HIST.length-1]);sel=null;try{localStorage.setItem('pp_custom',JSON.stringify(M))}catch(e){}draw();props()}
try{const s=localStorage.getItem('pp_custom');if(s)M=Object.assign(blank(),JSON.parse(s))}catch(e){}
HIST.push(JSON.stringify(M));
try{const b=localStorage.getItem('pp_custom_bg');if(b&&M.bg){const i=new Image();i.onload=()=>{BG.img=i;draw()};i.src=b}}catch(e){}
// ---------- vista ----------
function resize(){const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*devicePixelRatio);cv.height=Math.round(r.height*devicePixelRatio);draw()}
addEventListener('resize',resize);
const S2W=(px,py)=>({x:view.x+px/view.z,y:view.y+py/view.z}),W2S=(x,y)=>[(x-view.x)*view.z,(y-view.y)*view.z];
function fit(){const r=cv.getBoundingClientRect();view.z=Math.min(r.width/(M.w+10),r.height/(M.h+10));view.x=-5;view.y=-5;draw()}
// ---------- utilidades geométricas ----------
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((p.x-a[0])*dx+(p.y-a[1])*dy)/L));return Math.hypot(a[0]+dx*t-p.x,a[1]+dy*t-p.y)}
function polyDist(p,pts){let d=1e9;for(let i=0;i<pts.length-1;i++)d=Math.min(d,segDist(p,pts[i],pts[i+1]));return d}
function inPoly(p,pts){let c=false;for(let i=0,j=pts.length-1;i<pts.length;j=i++){const[xi,yi]=pts[i],[xj,yj]=pts[j];if((yi>p.y)!==(yj>p.y)&&p.x<(xj-xi)*(p.y-yi)/(yj-yi)+xi)c=!c}return c}
const roadW=r=>r.wide?(r.wideW||REF.wideW):(r.lanes||1)*(r.laneW||REF.laneW);
const snap=v=>Math.round(v*4)/4;
function smooth(pts,step=.75){if(pts.length<3)return pts;const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];const n=Math.max(1,Math.round(Math.hypot(p2[0]-p1[0],p2[1]-p1[1])/step));
  for(let k=0;k<n;k++){const t=k/n,t2=t*t,t3=t2*t;out.push([0,1].map(j=>.5*(2*p1[j]+(-p0[j]+p2[j])*t+(2*p0[j]-5*p1[j]+4*p2[j]-p3[j])*t2+(-p0[j]+3*p1[j]-3*p2[j]+p3[j])*t3)))}}out.push(pts[pts.length-1].slice());return out}
const rpts=r=>r.curva===false?r.pts:smooth(r.pts);
function offLine(pts,d){return pts.map((q,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];const dx=b[0]-a[0],dy=b[1]-a[1],l=Math.hypot(dx,dy)||1;return[q[0]-dy/l*d,q[1]+dx/l*d]})}
// ---------- búsqueda de elementos bajo el cursor ----------
function pick(p){const tol=6/view.z;let best=null,bd=1e9;const tryIt=(type,i,d)=>{if(d<bd){bd=d;best={type,i}}};
  M.cones.forEach((c,i)=>tryIt('cones',i,dist(p,c)-.4));M.people.forEach((c,i)=>tryIt('people',i,dist(p,c)-.5));
  M.signs.forEach((s,i)=>tryIt('signs',i,dist(p,s)-(s.w||REF.laneW)/2));M.texts.forEach((s,i)=>tryIt('texts',i,dist(p,s)-1));
  M.slots.forEach((s,i)=>tryIt('slots',i,dist(p,s)-1.2));
  M.poles.forEach((s,i)=>tryIt('poles',i,dist(p,s)-.6));(M.exam||[]).forEach((e,i)=>{if(e.x!=null)tryIt('exam',i,dist(p,e)-1.6)});M.trees.forEach((s,i)=>tryIt('trees',i,dist(p,s)-1.5));
  M.fences.forEach((f,i)=>tryIt('fences',i,polyDist(p,f.pts)-.4));
  M.slopes.forEach((q,i)=>tryIt('slopes',i,polyDist(p,q.pts)-(q.w||7)/2));
  if(dist(p,M.start)<2.5)tryIt('start',0,dist(p,M.start)-2.5);
  M.roads.forEach((r,i)=>tryIt('roads',i,polyDist(p,r.pts)-roadW(r)/2));
  M.rings.forEach((g,i)=>tryIt('rings',i,Math.abs(Math.hypot(p.x-g.x,p.y-g.y)-g.r)-(g.lanes||1)*(g.laneW||REF.ringLaneW)/2));
  M.bldgs.forEach((b,i)=>tryIt('bldgs',i,inPoly(p,b.pts)?0:polyDist(p,b.pts.concat([b.pts[0]]))));
  M.areas.forEach((a,i)=>tryIt('areas',i,inPoly(p,a.pts)?.5:polyDist(p,a.pts.concat([a.pts[0]]))));
  return bd<=tol?best:null}
function elem(s){return s.type==='start'?M.start:M[s.type][s.i]}
function moveElem(s,dx,dy){const e=elem(s);if(e.pts)for(const q of e.pts){q[0]+=dx;q[1]+=dy}else{e.x+=dx;e.y+=dy}}
// ---------- dibujo ----------
function draw(){const g=cx,dpr=devicePixelRatio;g.setTransform(dpr,0,0,dpr,0,0);const W=cv.width/dpr,H=cv.height/dpr;g.fillStyle=M.ground==='concreto'?'#7d7a72':'#2f6b2a';g.fillRect(0,0,W,H);
  // fondo (imagen calibrada)
  if(BG.img&&M.bg){const b=M.bg;const[a0,b0]=W2S(b.x,b.y);g.globalAlpha=b.op??.75;g.imageSmoothingEnabled=true;g.drawImage(BG.img,a0,b0,BG.img.width*b.mpp*view.z,BG.img.height*b.mpp*view.z);g.globalAlpha=1}
  // límites del plantel y cuadrícula
  {const[a,b]=W2S(0,0);g.strokeStyle='rgba(255,255,255,.55)';g.setLineDash([6,4]);g.strokeRect(a,b,M.w*view.z,M.h*view.z);g.setLineDash([]);
    const step=view.z>14?1:view.z>5?5:10;g.strokeStyle='rgba(255,255,255,.08)';g.lineWidth=1;g.beginPath();for(let x=0;x<=M.w;x+=step){const[p]=W2S(x,0);g.moveTo(p,b);g.lineTo(p,b+M.h*view.z)}for(let y=0;y<=M.h;y+=step){const[,q]=W2S(0,y);g.moveTo(a,q);g.lineTo(a+M.w*view.z,q)}g.stroke()}
  const poly=(pts,fill,stroke)=>{if(pts.length<2)return;g.beginPath();pts.forEach((q,i)=>{const[a,b]=W2S(q[0],q[1]);i?g.lineTo(a,b):g.moveTo(a,b)});g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}};
  const line=(pts,w,col,dash)=>{if(pts.length<2)return;g.beginPath();pts.forEach((q,i)=>{const[a,b]=W2S(q[0],q[1]);i?g.lineTo(a,b):g.moveTo(a,b)});g.lineWidth=Math.max(1,w*view.z);g.strokeStyle=col;g.lineJoin='round';g.lineCap='round';g.setLineDash(dash?dash.map(v=>v*view.z):[]);g.stroke();g.setLineDash([])};
  for(const a of M.areas)if(a.kind==='zacate'||a.kind==='acera')poly(a.pts,a.kind==='zacate'?'#4c9a45':'#b9b6ac',a.kind==='zacate'?'#f2c230':'#8d8a80');
  for(const a of M.areas)if(a.kind==='asfalto')poly(a.pts,'#3a3a43');
  for(const r of M.roads)line(rpts(r),roadW(r),'#3a3a43');
  for(const gr of M.rings){const w=(gr.lanes||1)*(gr.laneW||REF.ringLaneW);const[a,b]=W2S(gr.x,gr.y);g.lineWidth=w*view.z;g.strokeStyle='#3a3a43';g.beginPath();g.arc(a,b,gr.r*view.z,0,7);g.stroke();
    g.fillStyle='#f2c230';g.beginPath();g.arc(a,b,(gr.r-w/2)*view.z,0,7);g.fill();g.fillStyle='#4c9a45';g.beginPath();g.arc(a,b,Math.max(0,(gr.r-w/2-.3)*view.z),0,7);g.fill();
    if((gr.lanes||1)>1){g.setLineDash([3*view.z,3*view.z]);g.lineWidth=Math.max(1,.12*view.z);g.strokeStyle='#ecece4';g.beginPath();g.arc(a,b,gr.r*view.z,0,7);g.stroke();g.setLineDash([])}}
  // marcas de las calles
  for(const r of M.roads){const w=roadW(r),rp=rpts(r);line(offLine(rp,w/2-.25),.12,'#ecece4');line(offLine(rp,-(w/2-.25)),.12,'#ecece4');
    if(!r.oneway&&(r.lanes||1)>1&&!r.wide){const st=r.center||'dash';if(st==='dash')line(rp,.15,'#f2c230',[3,3]);else if(st==='solid')line(rp,.15,'#f2c230');else if(st==='double'){line(offLine(rp,.15),.12,'#f2c230');line(offLine(rp,-.15),.12,'#f2c230')}}
    if(r.oneway&&r.pts.length>1){const a=r.pts[0],b=r.pts[1],L=Math.hypot(b[0]-a[0],b[1]-a[1])||1,m=[(a[0]+b[0])/2,(a[1]+b[1])/2],u=[(b[0]-a[0])/L,(b[1]-a[1])/L];line([[m[0]-u[0],m[1]-u[1]],[m[0]+u[0],m[1]+u[1]]],.25,'#ecece4');line([[m[0]+u[0]-u[0]*.7+u[1]*.6,m[1]+u[1]-u[1]*.7-u[0]*.6],[m[0]+u[0],m[1]+u[1]],[m[0]+u[0]-u[0]*.7-u[1]*.6,m[1]+u[1]-u[1]*.7+u[0]*.6]],.25,'#ecece4')}}
  for(const a of M.areas)if(a.kind==='techo'){g.globalAlpha=.6;poly(a.pts,'#1f3f8f','#8fb4ff');g.globalAlpha=1;const q=a.pts;if(q.length===4){g.strokeStyle='rgba(143,180,255,.6)';g.lineWidth=1;for(let k=1;k<10;k++){const t=k/10,[x1,y1]=W2S(q[0][0]+(q[3][0]-q[0][0])*t,q[0][1]+(q[3][1]-q[0][1])*t),[x2,y2]=W2S(q[1][0]+(q[2][0]-q[1][0])*t,q[1][1]+(q[2][1]-q[1][1])*t);g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}}}
  for(const q of M.slopes){const[a0,b0]=q.pts[0],[a1,b1]=q.pts[1];const L=Math.hypot(a1-a0,b1-b0)||1,ux=(a1-a0)/L,uy=(b1-b0)/L,hw=(q.w||7)/2;const pts=[[a0-uy*hw,b0+ux*hw],[a1-uy*hw,b1+ux*hw],[a1+uy*hw,b1-ux*hw],[a0+uy*hw,b0-ux*hw]];
    g.globalAlpha=.35;poly(pts,'#c9a227','#f2c230');g.globalAlpha=1;for(let t=2;t<L-1;t+=3){const cxx=a0+ux*t,cyy=b0+uy*t;line([[cxx-uy*hw*.5-ux*.8,cyy+ux*hw*.5-uy*.8],[cxx,cyy],[cxx+uy*hw*.5-ux*.8,cyy-ux*hw*.5-uy*.8]],.18,'rgba(255,255,255,.8)')}
    const[sx,sy]=W2S(a0+ux*L/2,b0+uy*L/2);g.fillStyle='#fff';g.font='700 12px system-ui';g.textAlign='center';g.fillText('BAJA '+Math.round((q.grade||.1)*100)+'%',sx,sy-6)}
  for(const f of M.fences){const col={malla:'#aab4be',verja:'#3d3d46',muro:'#9a948a',barrera:'#ff7b00'}[f.kind]||'#aab4be';line(f.pts,f.kind==='muro'?.3:f.kind==='barrera'?.5:.12,col,f.kind==='malla'?[.4,.25]:null);

    note=`Medidas de referencia: carril ${REF.laneW} m (urbano ${REF.laneUrb} m), carril ancho de una vía ${REF.wideW} m, carril de rotonda ${REF.ringLaneW} m, carro promedio ${REF.car.L}×${REF.car.W} m, espacio de parqueo ${REF.slot.w}×${REF.slot.l} m.<br><br>Elementos: ${M.roads.length} calles, ${M.rings.length} rotondas, ${M.cones.length} conos, ${M.signs.length} señales, ${M.slots.length} espacios, ${M.bldgs.length} edificios.<br><br>Se guarda solo en este navegador. Use «Guardar archivo» para pasárselo a otra persona.`}
  else if(sel.type==='roads'){title='Calle';f=[choose('Tipo',e.wide?'1w':String(e.lanes||1),[['2','2 carriles'],['1','1 carril'],['1w','1 carril ancho']],v=>{e.wide=v==='1w';e.lanes=v==='2'?2:1;if(v!=='2')e.oneway=true}),field('Ancho de carril (m)',e.laneW||REF.laneW,v=>e.laneW=+v),field('Ancho carril ancho (m)',e.wideW||REF.wideW,v=>e.wideW=+v),check('Una sola vía',e.oneway,v=>e.oneway=v),check('Curva suave',e.curva!==false,v=>e.curva=v),choose('Línea central',e.center||'dash',[['dash','Discontinua'],['solid','Continua'],['double','Doble continua'],['none','Ninguna']],v=>e.center=v)];
    note=`Ancho total: ${roadW(e).toFixed(2)} m. El sentido de una vía va del primer punto al último.<div class="row"><button id="bRev">Invertir sentido</button></div>`}
  else if(sel.type==='rings'){title='Rotonda';f=[choose('Carriles',e.lanes||1,[[1,'1 carril'],[2,'2 carriles']],v=>e.lanes=+v),field('Radio al centro del carril (m)',e.r.toFixed(1),v=>e.r=+v),field('Ancho de carril (m)',e.laneW||REF.ringLaneW,v=>e.laneW=+v)];note='Se circula en sentido antihorario visto desde arriba. La isla es el zacate del centro.'}
  else if(sel.type==='signs'){title=e.kind==='alto'?'ALTO':'CEDA';f=[choose('Tipo',e.kind,[['alto','ALTO'],['ceda','CEDA']],v=>e.kind=v),field('Ancho de la línea (m)',e.w,v=>e.w=+v),field('Ángulo (°)',Math.round((e.ang||0)*180/Math.PI),v=>e.ang=(+v)*Math.PI/180,'number','5')];note='La raya amarilla del dibujo apunta hacia donde viene el carro.'}
  else if(sel.type==='slots'){title='Espacio de parqueo';f=[field('Número',e.num,v=>e.num=v,'text'),field('Ancho (m)',e.w,v=>e.w=+v),field('Largo (m)',e.l,v=>e.l=+v),field('Ángulo (°)',Math.round((e.ang||0)*180/Math.PI),v=>e.ang=(+v)*Math.PI/180,'number','5'),check('Espacio de la prueba (amarillo)',e.target,v=>{M.slots.forEach(s=>s.target=false);e.target=v}),check('Ocupado por un carro',e.ocupado,v=>e.ocupado=v)];note='El carro debe quedar estacionado de RETROCESO: con el frente hacia la salida del espacio.'}
  else if(sel.type==='texts'){title='Texto';f=[field('Texto',e.t,v=>e.t=String(v).toUpperCase(),'text'),field('Tamaño (m)',e.size||1.2,v=>e.size=+v),field('Ángulo (°)',Math.round((e.ang||0)*180/Math.PI),v=>e.ang=(+v)*Math.PI/180,'number','5'),choose('Color',e.col||'#ecece4',[['#ecece4','Blanco'],['#f2c230','Amarillo']],v=>e.col=v)]}
  else if(sel.type==='bldgs'){title='Edificio';f=[field('Nombre',e.label,v=>e.label=v,'text'),field('Altura (m)',e.h,v=>e.h=+v),choose('Color',e.col,[['#ecebe4','Blanco'],['#d9c7a3','Beige'],['#9fb7c9','Celeste'],['#c96e5a','Ladrillo'],['#7f8c8d','Gris'],['#2e8b57','Verde']],v=>e.col=v)]}
  else if(sel.type==='areas'){title='Área';f=[choose('Tipo',e.kind,[['asfalto','Asfalto (se puede manejar)'],['zacate','Zacate / isla'],['acera','Acera'],['techo','Techo / toldo solar'],['limite','Límite del plantel']],v=>e.kind=v)].concat(e.kind==='techo'?[field('Altura del techo (m)',e.h||4.2,v=>e.h=+v)]:[])}
  else if(sel.type==='cones'){title='Cono';f=[choose('Color',e.col,[['n','Naranja'],['v','Verde']],v=>e.col=v),check('Si lo toca pierde la prueba',e.fatal,v=>e.fatal=v)]}
  else if(sel.type==='fences'){title='Valla';f=[choose('Tipo',e.kind,[['malla','Valla de malla'],['verja','Verja de hierro'],['muro','Muro / tapia'],['barrera','Barrera naranja']],v=>e.kind=v)];note='El carro no puede atravesarla.'}
  else if(sel.type==='poles'){title='Poste';f=[choose('Tipo',e.kind,[['luz','Poste de luz'],['poste','Poste / columna']],v=>e.kind=v)]}
  else if(sel.type==='trees'){title='Árbol';f=[field('Radio de la copa (m)',e.r||2,v=>e.r=+v)]}
  else if(sel.type==='slopes'){title='Subida / pendiente';f=[field('Pendiente (%)',Math.round((e.grade||.1)*100),v=>e.grade=Math.max(1,Math.min(25,+v))/100,'number','1'),field('Ancho (m)',e.w||7,v=>e.w=+v)];note='La flecha apunta hacia donde BAJA. En el juego el carro se va para atrás si no frena o no usa el freno de mano.<div class="row"><button id="bRev">Invertir</button></div>'}
  else if(sel.type==='exam'){title='Paso '+(sel.i+1)+' del examen';f=[choose('Tipo',e.tipo,[['fase1','Fase 1 (revisión del carro)'],['ir','Ir a un punto'],['fila','Fila (esperar turno)'],['zigzag','Zigzag'],['rotonda','Rotonda'],['alto5','ALTO de 5 segundos'],['salida','Salida']],v=>e.tipo=v),field('Instrucción',e.txt||'',v=>e.txt=v,'text')];
    note='Los pasos se hacen en orden (1, 2, 3…). Arrastre el círculo morado para moverlo.<div class="row"><button id="bExUp">Subir</button><button id="bExDn">Bajar</button><button id="bExDel">Quitar paso</button></div>'}
  else if(sel.type==='people'){title='Persona';f=[choose('Tipo',e.kind,[['evaluador','Evaluador'],['persona','Persona']],v=>e.kind=v)]}
  else if(sel.type==='start'){title='Inicio del carro';f=[field('Ángulo (°)',Math.round((e.ang||0)*180/Math.PI),v=>e.ang=(+v)*Math.PI/180,'number','5')]}
  P.innerHTML=`<h2>${title}</h2>`+f.map(x=>x.html).join('')+`<div class="note">${note}</div>`;
  for(const x of f){const el=$(x.id);el.onchange=()=>{x.on(x.chk?el.checked:el.value);save()}}
  if($('bRev'))$('bRev').onclick=()=>{e.pts.reverse();save()}
  if($('bExUp'))$('bExUp').onclick=()=>{const i=sel.i;if(i>0){[M.exam[i-1],M.exam[i]]=[M.exam[i],M.exam[i-1]];sel.i--;save()}};
  if($('bExDn'))$('bExDn').onclick=()=>{const i=sel.i;if(i<M.exam.length-1){[M.exam[i+1],M.exam[i]]=[M.exam[i],M.exam[i+1]];sel.i++;save()}};
  if($('bExDel'))$('bExDel').onclick=()=>{M.exam.splice(sel.i,1);sel=null;save()}}
// ---------- fondo: imagen propia o satélite ----------
$('bBg').onclick=()=>$('fBg').click();
$('fBg').onchange=()=>{const f=$('fBg').files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>setBg(rd.result,{x:0,y:0,mpp:.1,op:.75,src:'Imagen propia — calibre con «Calibrar fondo»'});rd.readAsDataURL(f)};
function setBg(url,b){const i=new Image();i.onload=()=>{BG.img=i;M.bg=b;try{localStorage.setItem('pp_custom_bg',url)}catch(e){alert('La imagen es muy grande para guardarla en el navegador; se verá solo en esta sesión.')}save()};i.src=url}
$('bCal').onclick=()=>{if(!M.bg){alert('Primero ponga una imagen de fondo.');return}setTool('sel',null);cal={};$('hint').textContent=HINTS.cal};
const SATZ=19,SATN=2**SATZ,stx=l=>(l+180)/360*SATN*256,sty=l=>{const q=l*Math.PI/180;return(1-Math.log(Math.tan(q)+1/Math.cos(q))/Math.PI)/2*SATN*256};
const SAT0={lat:9.9131,lon:-84.0756};// esquina de la primera foto de Ciudad Vial (para alinear dibujos viejos)
async function satArea(la0,la1,lo0,lo1,label){const X0=stx(lo0),X1=stx(lo1),Y0=sty(la1),Y1=sty(la0),c=document.createElement('canvas');c.width=Math.round(X1-X0);c.height=Math.round(Y1-Y0);const g=c.getContext('2d');$('hint').textContent='Descargando la foto satelital…';
  const load=src=>new Promise(r=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src});
  for(let ty=Math.floor(Y0/256);ty<=Math.floor(Y1/256);ty++)for(let tx=Math.floor(X0/256);tx<=Math.floor(X1/256);tx++){const i=await load(`https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${SATZ}/${ty}/${tx}`);if(i)g.drawImage(i,tx*256-X0,ty*256-Y0)}
  const mpp=156543.03*Math.cos(((la0+la1)/2)*Math.PI/180)/SATN;
  // alinear: la foto vieja tenía su esquina en geo (o en SAT0 si no se guardó) y estaba puesta en (bg.x,bg.y)
  let x=0,y=0;if(M.bg){const old=M.bg.geo||{X0:stx(SAT0.lon),Y0:sty(SAT0.lat)};x=M.bg.x+(X0-old.X0)*M.bg.mpp;y=M.bg.y+(Y0-old.Y0)*M.bg.mpp}
  setBg(c.toDataURL('image/jpeg',.82),{x,y,mpp,op:M.bg?M.bg.op??.8:.8,src:'Imagen: Esri World Imagery · '+label,geo:{X0,Y0}});
  const r=cv.getBoundingClientRect();view.z=Math.min(r.width/(c.width*mpp),r.height/(c.height*mpp));view.x=x;view.y=y;draw();$('hint').textContent='Foto lista (escala real). Ahora se ve la calle de afuera: trace la entrada y luego el «Límite del plantel».'}
$('bSat').onclick=()=>satArea(9.9098,9.9142,-84.0775,-84.0722,'Ciudad Vial y alrededores, Paso Ancho');
// ---------- revisión automática ----------
let ISSUES=[];
function review(){const out=[],near=(p,tol)=>{for(const o of M.roads)if(polyDist({x:p[0],y:p[1]},rpts(o))<roadW(o)/2+tol)return true;for(const g of M.rings)if(Math.abs(Math.hypot(p[0]-g.x,p[1]-g.y)-g.r)<(g.lanes||1)*(g.laneW||REF.ringLaneW)/2+tol)return true;for(const a of M.areas)if(a.kind==='asfalto'&&inPoly({x:p[0],y:p[1]},a.pts))return true;return false};
  M.roads.forEach((r,i)=>{for(const e of[r.pts[0],r.pts[r.pts.length-1]]){const others=M.roads.filter((o,j)=>j!==i);const ok=others.some(o=>polyDist({x:e[0],y:e[1]},rpts(o))<roadW(o)/2+.6)||M.rings.some(g=>Math.abs(Math.hypot(e[0]-g.x,e[1]-g.y)-g.r)<(g.lanes||1)*(g.laneW||REF.ringLaneW)/2+.6)||M.areas.some(a=>a.kind==='asfalto'&&inPoly({x:e[0],y:e[1]},a.pts));
      if(!ok)out.push({x:e[0],y:e[1],t:'Calle '+(i+1)+': el extremo no se une con nada (¿falta conectarla o es la entrada/salida?)'})}});
  M.cones.forEach(c=>{for(const r of M.roads){const d=polyDist(c,rpts(r)),hw=roadW(r)/2;if(d<hw-.9&&d>.5){out.push({x:c.x,y:c.y,t:'Cono dentro del carril (a '+(hw-d).toFixed(1)+' m de la orilla)'});break}}});
  if(!near([M.start.x,M.start.y],0))out.push({x:M.start.x,y:M.start.y,t:'El INICIO del carro no está sobre asfalto'});
  M.signs.forEach(s=>{if(!near([s.x,s.y],0))out.push({x:s.x,y:s.y,t:(s.kind==='alto'?'ALTO':'CEDA')+' fuera de la calle'})});
  M.slots.forEach(s=>{if(!near([s.x+Math.cos(s.ang||0)*(s.l||5)/2*1.1,s.y+Math.sin(s.ang||0)*(s.l||5)/2*1.1],.5))out.push({x:s.x,y:s.y,t:'Espacio '+s.num+': la salida no da a una calle'})});
  if(!M.slots.length)out.push({t:'No hay espacios de parqueo (la prueba incluye estacionar en reversa).'});else if(!M.slots.some(s=>s.target))out.push({t:'Ningún espacio está marcado como el de la prueba (amarillo).'});
  if(!M.people.some(p=>p.kind==='evaluador'))out.push({t:'No hay evaluadores.'});
  if(!M.signs.some(s=>s.kind==='alto'))out.push({t:'No hay ningún ALTO.'});
  if(M.rings.length&&!M.signs.some(s=>s.kind==='ceda'))out.push({t:'Hay rotonda pero ningún CEDA en sus entradas.'});
  ISSUES=out;draw();
  $('props').innerHTML='<h2>Revisión</h2>'+(out.length?'<div class="note">Los puntos marcados en rojo en el mapa:</div><ol style="padding-left:18px;font-size:13px;line-height:1.5">'+out.slice(0,60).map((q,i)=>`<li><a href="#" data-i="${i}" style="color:inherit">${q.t}</a></li>`).join('')+'</ol>'+(out.length>60?`<div class="note">…y ${out.length-60} más.</div>`:''):'<div class="note">No encontré problemas. ✔</div>')+'<div class="row"><button id="bCloseRev">Cerrar</button></div>';
  $('props').querySelectorAll('a[data-i]').forEach(a=>a.onclick=ev=>{ev.preventDefault();const q=out[+a.dataset.i];if(q.x!=null){const r=cv.getBoundingClientRect();view.x=q.x-r.width/2/view.z;view.y=q.y-r.height/2/view.z;draw()}});
  $('bCloseRev').onclick=()=>{ISSUES=[];draw();props()}}
$('bCheck').onclick=review;
// ---------- archivo ----------
$('bNew').onclick=()=>{if(!confirm('¿Empezar un plantel nuevo? Se borra el actual de este navegador (guarde el archivo antes si lo quiere).'))return;M=blank();BG.img=null;try{localStorage.removeItem('pp_custom_bg')}catch(e){}sel=null;save();fit()};
$('bSave').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(M,null,1)],{type:'application/json'}));a.download=(M.name||'plantel').replace(/[^\w\- ]+/g,'').trim()+'.json';a.click()};
$('bOpen').onclick=()=>$('fOpen').click();
$('fOpen').onchange=()=>{const f=$('fOpen').files[0];if(!f)return;f.text().then(t=>{try{M=Object.assign(blank(),JSON.parse(t));sel=null;save();fit()}catch(e){alert('Ese archivo no es un plantel válido.')}})};
$('bUndo').onclick=undo;
$('showExam').onchange=draw;
$('bAddExam').onclick=()=>{const r=cv.getBoundingClientRect(),c=S2W(r.width/2,r.height/2);M.exam=M.exam||[];M.exam.push({tipo:'ir',x:snap(c.x),y:snap(c.y),txt:'Siga hasta este punto.'});sel={type:'exam',i:M.exam.length-1};save()};
$('bHelp').onclick=()=>{$('props').innerHTML=`<h2>Cómo crear un plantel</h2><ol style="padding-left:18px;font-size:13px;line-height:1.55">
<li>Ponga una foto de fondo: «Fondo: imagen…» (foto aérea o de Google Maps) y luego «Calibrar fondo»: toque dos puntos y escriba los metros reales entre ellos.</li>
<li>Trace las calles por el CENTRO del carril. Doble clic para terminar cada calle. Use «1 carril», «2 carriles» o «1 carril ancho».</li>
<li>Agregue rotondas, asfalto (patios e intersecciones), conos, ALTO y CEDA (arrastre en el sentido en que llega el carro).</li>
<li>Ponga los espacios de parqueo (arrastre hacia la salida del espacio) y marque el de la prueba en amarillo.</li>
<li>Agregue edificios, toldos, vallas, verjas, muros, barreras, postes, árboles, subidas, evaluadores y el INICIO del carro.</li>
<li>Toque «Revisar» y corrija lo que salga en rojo.</li>
<li>Toque «▶ Probar en el juego» para manejarlo.</li>
<li>Al terminar toque «Guardar archivo» y envíe el archivo .json a Plantel Pixel (por correo o WhatsApp).</li></ol>
<div class="note">Atajos: V seleccionar · X borrar · Supr borra lo seleccionado · Ctrl+Z deshacer · Esc cancela · rueda del mouse para acercar · clic derecho y arrastrar para moverse.</div><div class="row"><button onclick="props()">Cerrar</button></div>`};
$('bPlay').onclick=()=>{if(!M.roads.length&&!M.rings.length&&!M.areas.some(a=>a.kind==='asfalto')){alert('Dibuje al menos una calle o un área de asfalto.');return}save(false);location.href='index.html#custom'};
resize();if(M.roads.length||M.rings.length)fit();setTool('sel',document.querySelector('[data-tool=sel]'));
</script>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel del Instructor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d16;--panel:#16162a;--line:#2c2c48;--fg:#f1f1e8;--mut:#9a9ab8;--acc:#ffd23f;--good:#3ddc84;--bad:#ff4d4d;--warn:#ffb347;--info:#4dc3ff;--c1:#ffd23f;--c2:#4dc3ff;--c3:#3ddc84}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px;justify-content:space-between}
h1{font-family:'Press Start 2P',monospace;font-size:18px;color:var(--acc);margin:0 0 8px;line-height:1.4}
header p{margin:0;color:var(--mut);max-width:640px}
a{color:var(--info)}
main{max-width:1200px;margin:0 auto;padding:8px 16px 40px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
main>*,.det>*{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:0 0 12px}
textarea{width:100%;min-height:90px;background:#0b0b14;color:#bfe0ff;border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
button{font:inherit;font-size:14px;background:#26264a;color:var(--fg);border:1px solid #4a4a7a;border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{background:#30305a}
button.pri{background:var(--acc);color:#1a1a1a;border-color:var(--acc);font-weight:600}
button.danger{border-color:#7a2a2a;color:#ffb3b3;background:#2a1418}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
#msg{color:var(--good);min-height:1.5em}
#msg.err{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
select,input[type=search]{background:#0b0b14;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:14px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr.st{cursor:pointer}
tbody tr.st:hover{background:#1d1d36}
tbody tr.sel{background:#232344}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
.ok{background:rgba(61,220,132,.15);color:var(--good)}
.mid{background:rgba(255,179,71,.15);color:var(--warn)}
.no{background:rgba(255,77,77,.15);color:var(--bad)}
.none{color:var(--mut)}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media(max-width:820px){.det{grid-template-columns:1fr}}
.bar{display:grid;grid-template-columns:1fr 110px 30px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bar i{display:block;height:8px;border-radius:4px;background:var(--bad)}
.bar .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
details summary{cursor:pointer;color:var(--mut)}
.faults{font-size:13px;color:#ffc9c9;margin:4px 0 0 14px}
.empty{color:var(--mut);padding:20px;text-align:center}
svg text{fill:var(--mut);font-size:11px}
</style>
</head>
<body>
<header>
  <div>
    <h1>PANEL DEL INSTRUCTOR</h1>
    <p>Pegue aquí los códigos de reporte que le envían sus alumnos desde <b>Plantel Pixel → 6 · Progreso</b>. Los datos se guardan solo en este navegador.</p>
  </div>
  <a href="./">← Volver al simulador</a>
</header>
<main>
  <section class="card">
    <h2>Agregar reportes</h2>
    <textarea id="codes" placeholder="Pegue uno o varios códigos (empiezan con PPZ1. o PPJ1.). Puede pegar el mensaje de WhatsApp completo."></textarea>
    <div class="row">
      <button class="pri" id="add">Agregar</button>
      <button id="demo">Cargar alumnos de ejemplo</button>
      <button id="csv">Exportar CSV</button>
      <button class="danger" id="wipe">Borrar todo</button>
      <span id="msg"></span>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="card">
    <h2>Alumnos</h2>
    <div class="filters">
      <select id="fGroup"><option value="">Todos los grupos</option></select>
      <input type="search" id="fName" placeholder="Buscar alumno…">
    </div>
    <div class="tw"><table>
      <thead><tr><th>Alumno</th><th>Grupo</th><th>Último reporte</th><th class="num">Intentos</th><th class="num">Teórico</th><th class="num">Plantel</th><th class="num">Calle</th><th>Falta más repetida</th><th>Estado</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>

  <section class="card" id="detail" hidden></section>
</main>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='pp_instr';
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||{students:{}}}catch(e){return{students:{}}}};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){msg('No se pudo guardar en este navegador.',true)}};
let DB=load(),SEL=null;
const MN={teorico:'Teórico',sanjose:'Plantel San José',plantel:'Plantel (tutorial)',street:'Prueba en calle',city:'Manejo libre',sjlibre:'San José libre',alajuela:'Alajuela · taxi',centro:'Ruta: Centro de San José',r27:'Ruta 27',r32:'Ruta 32',tilaran:'Ruta Tilarán',manuel:'Ruta Manuel Antonio',cerro:'Ruta Cerro de la Muerte'};
for(const[k,n]of[['heredia','Heredia'],['alajuela','Alajuela'],['perez','Pérez Zeledón'],['rioclaro','Río Claro'],['limon','Limón'],['guapiles','Guápiles'],['sancarlos','San Carlos'],['nicoya','Nicoya'],['puntarenas','Puntarenas'],['liberia','Liberia']])MN['pl_'+k]='Plantel '+n+' (prelim.)';
for(const[k,n]of[['heredia','Heredia'],['alajuela','Alajuela'],['sanramon','San Ramón'],['cartago','Cartago'],['perez','Pérez Zeledón'],['rioclaro','Río Claro'],['sancarlos','San Carlos'],['guapiles','Guápiles'],['nicoya','Nicoya'],['liberia','Liberia']])MN['of_'+k]='Recorrido oficial '+n;
const fmtD=t=>new Date(t).toLocaleDateString('es-CR',{day:'2-digit',month:'short',year:'numeric'});
const fmtT=s=>`${String(s/60|0).padStart(2,'0')}:${String(s%60|0).padStart(2,'0')}`;
function msg(t,err){$('msg').textContent=t;$('msg').className=err?'err':''}

async function decode(code){const kind=code.slice(0,5),b=code.slice(5).replace(/-/g,'+').replace(/_/g,'/');const pad=b+'='.repeat((4-b.length%4)%4);const bin=atob(pad);
  if(kind==='PPJ1.')return JSON.parse(decodeURIComponent(escape(bin)));
  const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));return JSON.parse(await new Response(ds).text())}

function valid(r){return r&&typeof r==='object'&&typeof r.id==='string'&&Array.isArray(r.h)}
function merge(r){const id=r.id.slice(0,40);const old=DB.students[id];const hist=new Map();
  for(const a of(old?old.h:[]).concat(r.h))if(a&&typeof a.d==='number')hist.set(a.d+'|'+a.m,a);
  DB.students[id]={id,n:String(r.n||'SIN NOMBRE').slice(0,40),g:String(r.g||'').slice(0,40),at:Math.max(r.at||0,old?old.at:0),prog:r.prog||{},w:r.w||0,prof:(r.prof&&{lic:String(r.prof.lic||'').slice(0,8),dev:String(r.prof.dev||'').slice(0,8)})||(old&&old.prof)||null,first:old?old.first:Date.now(),h:[...hist.values()].sort((a,b)=>a.d-b.d).slice(-400)}}

$('add').onclick=async()=>{const codes=$('codes').value.match(/PP[ZJ]1\.[A-Za-z0-9_-]+/g)||[];if(!codes.length){msg('No encontré ningún código. Deben empezar con PPZ1. o PPJ1.',true);return}
  let ok=0,bad=0;for(const c of codes){try{const r=await decode(c);if(!valid(r))throw 0;merge(r);ok++}catch(e){bad++}}
  save();$('codes').value='';msg(`${ok} reporte${ok===1?'':'s'} agregado${ok===1?'':'s'}`+(bad?` · ${bad} no se pudieron leer (¿código incompleto?)`:''),bad&&!ok);render()};
$('wipe').onclick=()=>{if(!confirm('¿Borrar todos los alumnos de este navegador? No se puede deshacer.'))return;DB={students:{}};SEL=null;save();render();msg('Datos borrados.')};

// ---------- cálculo ----------
const FREE=new Set(['city','sjlibre','alajuela']);const exams=a=>a.filter(x=>!x.prac&&!FREE.has(x.m));
function best(s,ms){const v=s.h.filter(x=>(ms.includes(x.m)||(ms.includes('sanjose')&&/^(pl|of)_/.test(String(x.m))))&&!x.prac).map(x=>x.s);return v.length?Math.max(...v):null}
function topFault(h){const fc={};for(const a of h)for(const f of a.f||[])fc[f[0]]=(fc[f[0]]||0)+1;return Object.entries(fc).sort((a,b)=>b[1]-a[1])}
function status(s){const t=best(s,['teorico']),p=best(s,['plantel','sanjose']),c=best(s,['street']);const drv=exams(s.h).filter(x=>x.m!=='teorico').slice(-3);
  const avg=drv.length?drv.reduce((a,x)=>a+x.s,0)/drv.length:null;
  if(t>=70&&p>=80&&c>=80&&avg!==null&&avg>=80)return['Listo para la prueba','ok'];
  if(!drv.length&&t===null)return['Sin intentos','none'];
  if(avg!==null&&avg<65)return['Necesita práctica','no'];
  return['En progreso','mid']}
const cell=(v,min)=>v===null?'<span class="none">—</span>':`<span class="chip ${v>=min?'ok':'no'}">${v}</span>`;

// ---------- vista ----------
function render(){const all=Object.values(DB.students);const g=$('fGroup').value,q=$('fName').value.trim().toUpperCase();
  const groups=[...new Set(all.map(s=>s.g).filter(Boolean))].sort();$('fGroup').innerHTML='<option value="">Todos los grupos</option>'+groups.map(x=>`<option${x===g?' selected':''}>${esc(x)}</option>`).join('');
  const list=all.filter(s=>(!g||s.g===g)&&(!q||s.n.toUpperCase().includes(q))).sort((a,b)=>b.at-a.at);
  const att=list.reduce((n,s)=>n+exams(s.h).length,0),ready=list.filter(s=>status(s)[1]==='ok').length,need=list.filter(s=>status(s)[1]==='no').length;
  const gf=topFault(list.flatMap(s=>s.h));
  $('kpis').innerHTML=[[list.length,'alumnos'],[att,'intentos de examen'],[ready,'listos para la prueba'],[need,'necesitan práctica'],[gf[0]?gf[0][1]+'×':'—',gf[0]?'falta más común: '+esc(gf[0][0]):'falta más común del grupo']]
    .map(([v,l])=>`<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  $('rows').innerHTML=list.length?list.map(s=>{const st=status(s),tf=topFault(s.h)[0];return`<tr class="st${s.id===SEL?' sel':''}" data-id="${esc(s.id)}"><td><b>${esc(s.n)}</b>${s.prof&&s.prof.lic&&s.prof.lic!=='-'?` <span class="chip">${esc(s.prof.lic)}</span>`:''}${s.prof&&s.prof.dev?` <span class="none">${s.prof.dev==='movil'?'teléfono':'computadora'}</span>`:''}</td><td>${esc(s.g)||'<span class="none">—</span>'}</td><td>${fmtD(s.at)}</td><td class="num">${exams(s.h).length}</td>
      <td class="num">${cell(best(s,['teorico']),70)}</td><td class="num">${cell(best(s,['plantel','sanjose']),80)}</td><td class="num">${cell(best(s,['street']),80)}</td>
      <td style="max-width:260px;overflow:hidden;text-overflow:ellipsis">${tf?esc(tf[0])+` <span class="none">(${tf[1]}×)</span>`:'<span class="none">—</span>'}</td><td><span class="chip ${st[1]}">${st[0]}</span></td></tr>`}).join('')
    :`<tr><td colspan="9" class="empty">Aún no hay alumnos. Pegue un código arriba o pulse “Cargar alumnos de ejemplo”.</td></tr>`;
  for(const tr of document.querySelectorAll('tr.st'))tr.onclick=()=>{SEL=tr.dataset.id;render();$('detail').scrollIntoView({behavior:'smooth',block:'start'})};
  renderDetail()}
$('fGroup').onchange=render;$('fName').oninput=render;

function chart(h){const pts=exams(h).slice(-30);if(pts.length<2)return'<div class="empty">Se necesitan al menos 2 intentos para ver la evolución.</div>';
  const W=520,H=180,L=34,R=10,T=10,B=24,n=pts.length,X=i=>L+(W-L-R)*i/(n-1),Y=v=>T+(H-T-B)*(1-v/100);
  const ser={teo:{c:'var(--c1)',m:['teorico']},pla:{c:'var(--c2)',m:['plantel','sanjose']},cal:{c:'var(--c3)',m:['street']}};
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución de notas">`;
  for(const v of[0,50,70,80,100]){s+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v===80||v===70?'#5a5a2a':'#2c2c48'}" ${v===80||v===70?'stroke-dasharray="4 4"':''}/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${v}</text>`}
  for(const k in ser){const idx=pts.map((p,i)=>[p,i]).filter(([p])=>ser[k].m.includes(p.m));if(!idx.length)continue;
    s+=`<polyline fill="none" stroke="${ser[k].c}" stroke-width="2" points="${idx.map(([p,i])=>X(i)+','+Y(p.s)).join(' ')}"/>`;
    for(const[p,i]of idx)s+=`<circle cx="${X(i)}" cy="${Y(p.s)}" r="4" fill="${p.ok?ser[k].c:'var(--bg)'}" stroke="${ser[k].c}" stroke-width="2"><title>${esc(MN[p.m])} · ${p.s} · ${fmtD(p.d)}</title></circle>`}
  s+=`<text x="${L}" y="${H-6}">más antiguo</text><text x="${W-R}" y="${H-6}" text-anchor="end">más reciente</text></svg>`;
  return s+`<div class="legend"><span><i style="background:var(--c1)"></i>Teórico (mín. 70)</span><span><i style="background:var(--c2)"></i>Plantel (mín. 80)</span><span><i style="background:var(--c3)"></i>Calle (mín. 80)</span><span>● aprobado · ○ reprobado</span></div>`}

function renderDetail(){const d=$('detail');const s=DB.students[SEL];if(!s){d.hidden=true;return}d.hidden=false;
  const tf=topFault(s.h).slice(0,8),mx=tf.length?tf[0][1]:1;const st=status(s);
  const tp={};for(const a of s.h)if(a.m==='teorico'&&a.tp)for(const k in a.tp)tp[k]=(tp[k]||0)+a.tp[k];const tpl=Object.entries(tp).sort((a,b)=>b[1]-a[1]);
  const city=s.h.filter(a=>a.m==='city');
  d.innerHTML=`<div class="row" style="margin:0 0 12px;justify-content:space-between"><div><h2 style="margin:0">Detalle</h2><div style="font-size:20px;font-weight:700">${esc(s.n)} <span class="chip ${st[1]}">${st[0]}</span></div>
      <div class="none">${esc(s.g)||'Sin grupo'} · último reporte ${fmtD(s.at)} · ${s.w} preguntas teóricas pendientes de repasar${city.length?` · ${city.length} sesiones de calle libre`:''}</div></div>
      <div class="row" style="margin:0"><button id="close">Cerrar</button><button class="danger" id="del">Quitar alumno</button></div></div>
    <div class="det"><div class="card" style="background:#12122a"><h2>Evolución de notas</h2>${chart(s.h)}</div>
      <div class="card" style="background:#12122a"><h2>Faltas más repetidas</h2>${tf.length?tf.map(([t,n])=>`<div class="bar"><span class="t" title="${esc(t)}">${esc(t)}</span><i style="width:${Math.max(6,100*n/mx)}px"></i><span>${n}×</span></div>`).join(''):'<div class="empty">Sin faltas registradas.</div>'}
      ${tpl.length?`<h2 style="margin-top:16px">Temas del teórico con más errores</h2>`+tpl.slice(0,5).map(([t,n])=>`<div class="bar"><span class="t">${esc(t)}</span><i style="width:${Math.max(6,100*n/tpl[0][1])}px;background:var(--warn)"></i><span>${n}</span></div>`).join(''):''}</div></div>
    <div class="card" style="background:#12122a;margin-top:16px"><h2>Intentos</h2><div class="tw"><table><thead><tr><th>Fecha</th><th>Prueba</th><th class="num">Nota</th><th>Resultado</th><th class="num">Duración</th><th>Faltas</th></tr></thead><tbody>
      ${s.h.slice().reverse().slice(0,60).map(a=>{const res=a.m==='city'?`<span class="none">${a.tk?a.tk[0]:0} destinos</span>`:a.prac?'<span class="none">Práctica</span>':a.ok?'<span class="chip ok">Aprobado</span>':a.fin===false?'<span class="chip mid">Sin terminar</span>':'<span class="chip no">Reprobado</span>';
        const f=a.f||[];return`<tr><td>${fmtD(a.d)}</td><td>${esc(MN[a.m]||a.m)}</td><td class="num">${a.s}${a.m==='city'?' pts':''}</td><td>${res}</td><td class="num">${a.t?fmtT(a.t):a.n?a.c+'/'+a.n:'—'}</td>
        <td>${f.length?`<details><summary>${f.length} falta${f.length>1?'s':''}</summary>${f.map(x=>`<div class="faults">Cat. ${esc(x[1])} · ${esc(x[0])}</div>`).join('')}</details>`:'<span class="none">—</span>'}</td></tr>`}).join('')}
    </tbody></table></div></div>`;
  $('close').onclick=()=>{SEL=null;render()};
  $('del').onclick=()=>{if(!confirm(`¿Quitar a ${s.n} del panel?`))return;delete DB.students[s.id];SEL=null;save();render()}}

$('csv').onclick=()=>{const rows=[['Alumno','Grupo','Ultimo reporte','Intentos','Mejor teorico','Mejor plantel','Mejor calle','Estado','Falta mas repetida']];
  for(const s of Object.values(DB.students)){const tf=topFault(s.h)[0];rows.push([s.n,s.g,new Date(s.at).toISOString().slice(0,10),exams(s.h).length,best(s,['teorico'])??'',best(s,['plantel','sanjose'])??'',best(s,['street'])??'',status(s)[0],tf?tf[0]:''])}
  const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download='alumnos-plantel-pixel.csv';a.click()};

// ---------- ejemplo ----------
$('demo').onclick=()=>{const F=['No usó direccional DERECHA al doblar','No hizo ALTO total antes de la línea','Exceso de velocidad: 31 km/h en zona de 25','Tocar o botar un cono (baliza)','No cedió el paso a quien circula en la rotonda','Detenerse durante el retroceso','No usó direccional IZQUIERDA al circular (salida posterior a la 1ª)','Adelantar sin poner la direccional IZQUIERDA'];
  const R=(a,b)=>a+Math.random()*(b-a)|0,now=Date.now(),day=864e5;
  const mk=(n,g,skill)=>{const h=[];let t=now-R(18,30)*day;for(let i=0;i<R(8,16);i++){t+=R(1,3)*day*.6;const m=['teorico','sanjose','plantel','street','city'][R(0,5)];const lvl=skill+i*R(1,4);
      if(m==='teorico'){const s=Math.min(100,R(lvl-15,lvl+10));h.push({d:t,m,s,ok:s>=70,n:40,c:Math.round(s*.4),tp:{'SEÑALES':R(0,4),'PRIORIDAD Y ROTONDAS':R(0,5),'VELOCIDAD Y DISTANCIA':R(0,3)}});continue}
      const nf=Math.max(0,R(0,6)-Math.floor(i/4)+(skill<50?2:0));const f=[];for(let k=0;k<nf;k++){const tx=F[R(0,F.length)];f.push([tx,['I','II','II','III'][R(0,4)],R(10,300),0,0])}
      const s=m==='city'?R(200,1400):Math.max(0,100-f.reduce((a,x)=>a+({I:32,II:12,III:8,IV:4})[x[1]],0));h.push({d:t,m,s,ok:m==='city'?null:s>=80,fin:true,t:R(120,420),tk:[5,7],f})}
    return{v:1,id:'demo'+n.replace(/\W/g,''),n,g,at:t,prog:{},h,w:R(0,12)}};
  [['ANA MORA','GRUPO SABADO',55],['LUIS ARAYA','GRUPO SABADO',35],['MARIA SOLANO','GRUPO NOCHE',70],['DIEGO VARGAS','GRUPO NOCHE',45],['SOFIA JIMENEZ','GRUPO SABADO',62]].forEach(([n,g,k])=>merge(mk(n,g,k)));
  save();render();msg('Se cargaron 5 alumnos de ejemplo (puede quitarlos uno por uno o con “Borrar todo”).')};

render();
</script>
</body>
</html>
